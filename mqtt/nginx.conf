worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 1024; }

# TLS terminator for the Verkada camera.
#
# The camera speaks MQTT-over-WebSocket-Secure with a post-quantum TLS 1.3
# handshake (key_share X25519MLKEM768), which needs OpenSSL 3.5+ -- current
# nginx:alpine qualifies. Terminating TLS in mosquitto directly is flaky with
# this handshake even on 3.5, which is why this container exists at all.
http {
  access_log /dev/stdout;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 443 ssl;
    server_name _;

    # fullchain.pem = leaf + root CA. The camera is pushed the root CA alone
    # as its trust anchor; sending only the leaf gets "unknown ca".
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The camera picks its own path, so proxy everything.
    location / {
      proxy_pass http://mqtt-broker:9001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 900s;   # keep idle MQTT sessions alive
    }
  }
}
