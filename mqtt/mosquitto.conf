# Ingest broker for the Verkada object-position firehose.
#
# TLS is terminated by the mqtt-tls (nginx) container, so mosquitto itself
# speaks plaintext on a private docker network and publishes no host ports.
#   9001  websockets  <- nginx reverse-proxies the camera's WSS traffic here
#   1883  mqtt        <- the vFusion backend subscribes here
# per_listener_settings is omitted: it defaults to false, and setting it
# explicitly logs a deprecation warning on every boot that reads like a
# problem when it is not.
allow_anonymous false
password_file /mosquitto/config/passwd

log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp true

listener 9001
protocol websockets

listener 1883
protocol mqtt
