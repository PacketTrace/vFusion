# Serves the built dashboard and proxies everything the backend owns.
#
# The three proxied prefixes are the backend's entire external surface:
#   /api    the dashboard's own API
#   /hooks  where Verkada Command POSTs events
#   /onvif  what the Command Connector talks to for the virtual camera
# Everything else is the single-page app, which is why the fallback
# below has to be try_files and not a 404.
#
# This file is included from the main nginx.conf's http block, which is
# why a map can live here alongside the server.

# "upgrade" for a websocket handshake, "close" otherwise. nginx has no
# built-in for this, and hardcoding "upgrade" breaks keepalive on every
# ordinary request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Uploaded clips and generated video go through /api/video; the
    # default 1m body limit turns a 40MB upload into a 413 with no
    # useful message.
    client_max_body_size 512m;

    # Vite emits content-hashed filenames, so the bundle can be cached
    # hard. index.html and config.js must never be, or a browser keeps
    # running the old app against the new backend after an upgrade --
    # which is exactly the failure this whole feature exists to avoid.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade headers are here for the HLS/live paths and cost
        # nothing on a plain request.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Gemini analysis of a clip can legitimately take minutes, and
        # the default 60s read timeout turns that into a 504 halfway
        # through a run that is still working.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Streaming endpoints (live frames, HLS segments) must not sit
        # in a buffer waiting to be complete.
        proxy_buffering off;
    }

    location /hooks {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /onvif {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
